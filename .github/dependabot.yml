# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Commit prefixes decide what release-please does with a merged update:
# deps(...) is what ships (the binary and its image) and cuts a release;
# ci(...) and test(...) only touch CI and the E2E setup and do not.
#
# Every entry waits 7 days before proposing a new release, so a hijacked
# release has time to be caught; security updates skip the wait.

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(go):"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 5

  # Docker base image of the shipped image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker):"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 3

  # Go tools run by CI and the Makefile (golangci-lint, govulncheck)
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    # tools/go.mod lists them as indirect requirements, which Dependabot
    # skips unless they are allowed by name.
    allow:
      - dependency-name: "github.com/golangci/golangci-lint/v2"
      - dependency-name: "golang.org/x/vuln"
    commit-message:
      prefix: "ci(tools):"
    labels:
      - "dependencies"
      - "go"
    groups:
      tools:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # GitHub Actions, pinned by SHA
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(actions):"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Docker images of the E2E services, in one pull request per update
  - package-ecosystem: "docker"
    directories:
      - "/test/mock-twilio"
      - "/test/mock-exporter"
      - "/test/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "test(deps):"
    labels:
      - "dependencies"
      - "docker"
    groups:
      test-images:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # Go modules of the E2E services
  - package-ecosystem: "gomod"
    directories:
      - "/test/mock-twilio"
      - "/test/mock-exporter"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "test(deps):"
    labels:
      - "dependencies"
      - "go"
    groups:
      test-modules:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # Prometheus and Alertmanager in docker-compose.e2e.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "test(deps):"
    labels:
      - "dependencies"
      - "docker"
    groups:
      e2e-services:
        patterns: ["*"]
    open-pull-requests-limit: 2
