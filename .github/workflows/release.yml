# Releases are cut by release-please from the commit history on main.
#
# Commits follow Conventional Commits (feat:, fix:, deps:, feat!: ...).
# release-please keeps a "chore(main): release x.y.z" pull request open
# that prepends CHANGELOG.md and, once merged, creates the tag and the
# GitHub release. The binaries job then attaches the binaries to that
# release, and the image job builds and scans the image, then pushes
# ghcr.io/swatto/promtotwilio for that version. A high or critical
# finding with a fix stops the push.
#
# Bootstrap or rebuild by hand: Actions, Release, Run workflow, give a tag.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build the binaries and image for, e.g. v1.10.4
        required: true
permissions: {}
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # A personal access token (contents + pull-requests write) makes
          # CI run on the release pull request; GITHUB_TOKEN cannot.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make build-all VERSION="$TAG"
      # --clobber so a manual rebuild replaces the binaries already there.
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/promtotwilio-* --clobber

  image:
    needs: release-please
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      IMAGE: ghcr.io/swatto/promtotwilio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # v1.2.3 is pushed as 1.2.3, 1.2, 1 and latest.
      - name: Image tags from the tag
        id: tags
        run: |
          version=${TAG#v}
          minor=${version%.*}
          major=${version%%.*}
          {
            echo "tags<<EOF"
            echo "$IMAGE:$version"
            echo "$IMAGE:$minor"
            echo "$IMAGE:$major"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Scan the release build before anything is pushed. amd64 only:
      # both platforms build the same binary from the same modules, and
      # the push below reuses these layers from the builder's cache.
      - name: Build the image for the scan (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: VERSION=${{ env.TAG }}
          tags: promtotwilio:release
      # No DB cache here: a release only trusts what it downloads itself.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: promtotwilio:release
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.tags.outputs.tags }}
