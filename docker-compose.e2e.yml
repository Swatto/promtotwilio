services:
  mock-twilio:
    build:
      context: ./test/mock-twilio
      dockerfile: Dockerfile

  mock-exporter:
    build:
      context: ./test/mock-exporter
      dockerfile: Dockerfile

  promtotwilio:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SID: test-account-sid
      TOKEN: test-auth-token
      SENDER: "+15551234567"
      PORT: "9090"
      TWILIO_BASE_URL: "http://mock-twilio:8080"
      SEND_RESOLVED: "true"
      RATE_LIMIT: "30"
    depends_on:
      - mock-twilio

  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    volumes:
      - ./test/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--log.level=debug'
      - '--cluster.settle-timeout=0s'
    depends_on:
      - promtotwilio

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - ./test/prometheus:/etc/prometheus:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=debug'
    depends_on:
      - mock-exporter
      - alertmanager

  e2e-tests:
    build:
      context: ./test/e2e
      dockerfile: Dockerfile
    environment:
      APP_URL: "http://promtotwilio:9090"
      ALERTMANAGER_URL: "http://alertmanager:9093"
      MOCK_TWILIO_URL: "http://mock-twilio:8080"
      MOCK_EXPORTER_URL: "http://mock-exporter:9100"
      PROMETHEUS_URL: "http://prometheus:9090"
    depends_on:
      - promtotwilio
      - alertmanager
      - prometheus
